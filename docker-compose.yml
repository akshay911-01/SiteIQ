services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: siteiq-postgres
    environment:
      POSTGRES_DB: siteiq
      POSTGRES_USER: siteiq
      POSTGRES_PASSWORD: siteiq_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteiq -d siteiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: siteiq-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: siteiq-backend
    ports:
      - "8500:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: